services:
  - type: web
    name: buildium-mcp
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BUILDIUM_CLIENT_ID
        sync: false
      - key: BUILDIUM_CLIENT_SECRET
        sync: false
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_API_KEYS
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
